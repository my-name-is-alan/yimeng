# Copy and point YIMENG_CONFIG at it. Every key can also be overridden by env:
# YIMENG_BIND, YIMENG_LIBRARY_ROOTS (comma-separated), YIMENG_DB_PATH,
# YIMENG_VAULT_PATH, YIMENG_CACHE_DIR, YIMENG_CACHE_MAX_BYTES.
[server]
bind = "0.0.0.0:8741"

[library]
roots = ["/music"]

[db]
path = "/var/yimeng/library.db"

[vault]
path = "/var/yimeng/vault"
# master_key_file = "/var/yimeng/master.key"

[cache]
dir = "/var/yimeng/cache"
max_bytes = 2147483648

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0A0A0C">
<title>译梦 · 控制台</title>
<link rel="icon" type="image/png" sizes="32x32" href="brand/icon-ring-32.png">
<link rel="apple-touch-icon" href="brand/icon-ring-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app" class="app" data-state="boot">
  <aside class="sidebar" aria-label="主导航">
    <a class="brand" href="#/"><span class="brand-orb" aria-hidden="true"></span><span><b>译梦</b><small>Yimeng Core</small></span></a>
    <form class="side-search" role="search" id="searchForm">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="搜索 · 支持拼音 / 首字母" autocomplete="off" aria-label="搜索曲库">
    </form>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main id="main" class="main" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="快捷导航"></nav>
  <div id="nowbar" class="nowbar" hidden></div>
</div>
<div id="np" class="np" hidden></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>译梦 · 管理</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;background:#111;color:#eee}
input,button{font:inherit;padding:.5rem .75rem;border-radius:8px;border:1px solid #333;background:#222;color:#eee}
button{cursor:pointer;background:#3b82f6;border:none}
.card{background:#1a1a1a;padding:1rem;border-radius:12px;margin:1rem 0}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px}
.ok{color:#4ade80}.err{color:#f87171}
</style>
</head>
<body>
<h1>译梦 Core</h1>
<div class="card" id="setup">
  <h2>配对 / Setup</h2>
  <p>首次使用：在本机 Core 日志中查看配对码，或点击请求。</p>
  <button id="req">请求配对码提示</button>
  <label>配对码 <input id="code" placeholder="ABCD-EFGH"/></label>
  <label>设备名 <input id="name" value="Web Admin"/></label>
  <button id="pair">配对</button>
  <pre id="pairOut"></pre>
</div>
<div class="card">
  <h2>系统</h2>
  <button id="sys">GET /api/system</button>
  <button id="health">GET /api/library/health</button>
  <button id="stats">GET /api/stats</button>
  <pre id="out"></pre>
</div>
<script>
const tok=()=>localStorage.getItem('ymd_token')||'';
const auth=()=>({'Authorization':'Bearer '+tok()});
async function j(url,opt={}){const r=await fetch(url,opt);const t=await r.text();let b;try{b=JSON.parse(t)}catch{b=t};return {ok:r.ok,status:r.status,b};}
document.getElementById('req').onclick=async()=>{
  const {status,b}=await j('/api/pair/request',{method:'POST'});
  document.getElementById('pairOut').textContent=status+' '+JSON.stringify(b)+'\n(真正配对码在 Core 日志里)';
};
document.getElementById('pair').onclick=async()=>{
  const body=JSON.stringify({code:document.getElementById('code').value,name:document.getElementById('name').value,device_type:'web'});
  const {ok,status,b}=await j('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body});
  document.getElementById('pairOut').textContent=status+' '+JSON.stringify(b,null,2);
  if(ok&&b.token){localStorage.setItem('ymd_token',b.token);document.getElementById('pairOut').className='ok';}
};
async function show(path){const {status,b}=await j(path,{headers:auth()});document.getElementById('out').textContent=status+'\n'+JSON.stringify(b,null,2);}
document.getElementById('sys').onclick=()=>show('/api/system');
document.getElementById('health').onclick=()=>show('/api/library/health');
document.getElementById('stats').onclick=()=>show('/api/stats');
</script>
</body>
</html>

      responses:
        "200": { description: Resolution, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/online/favorites:
    get:
      tags: [online]
      summary: Cloud "liked songs" of each logged-in account (?origin=)
      responses:
        "200": { description: Liked playlists, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/online/{origin}/{kind}/{id}:
    get:
      tags: [online]
      summary: External item detail; kind = tracks | albums | artists | playlists. Playlists include per-track playable status, local links and counts
      responses:
        "200": { description: Item, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/online/{origin}/playlists/{id}/clone:
    post:
      tags: [online]
      summary: Import an external playlist into a 译梦 playlist (new, or merged into `into`). Body {name?, prefer_local? (default true), skip_unavailable?, into?}
      description: Tracks are stored as metadata snapshots so they survive takedowns (D51). Unavailable tracks are kept (unless skip_unavailable) and counted in `unavailable`; they carry `entitlement` in playlist listings and auto-switch on playback (D50). `into` must be one of the caller's playlists (404 otherwise).
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { playlist: { $ref: "#/components/schemas/Playlist" }, tracks: { type: integer, description: Same as added }, added: { type: integer }, skipped_duplicates: { type: integer, description: "Already in the target (or repeated in the source): same track id, linked local track, ISRC, or title+artist with duration within 3 s" }, linked_local: { type: integer }, skipped: { type: integer, description: Unavailable tracks dropped by skip_unavailable }, unavailable: { type: integer } } } } } }
        "200": { description: "Merged into an existing playlist (same body). Re-importing the same playlist adds nothing." }
        "404": { description: into playlist not found }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---- App API (D45). All paths also available under /api/v1. ----
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token (the ymd_ device token) for a new session; rotates the refresh token. Public.
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } }
      responses:
        "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshSession" } } } }
        "401": { description: invalid_refresh_token }
  /api/v1/server/info:
    get:
      tags: [system]
      summary: Public server description - name, version, api_version, features, platforms[{origin,name,enabled,logged_in,capabilities}]. nickname/vip only when authenticated.
      security: []
      responses:
        "200": { description: Info, content: { application/json: { schema: { $ref: "#/components/schemas/ServerInfo" } } } }
  /api/v1/events:
    get:
      tags: [system]
      summary: Server-Sent Events (same events as /ws, scoped to the caller). Auth via Bearer or ?access_token=/?token=. ?types=a,b filters. Keepalive every 15 s.
      parameters:
        - { name: types, in: query, schema: { type: string } }
      responses:
        "200": { description: text/event-stream; events favorites.changed, playlists.changed, history.added, progress.changed, library.updated, player.* }
  /api/v1/search/suggest:
    get:
      tags: [catalog]
      summary: Fast suggestions (prefix and pinyin) from the library
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "{q, items:[string]}" }
  /api/v1/images/{key}:
    get:
      tags: [media]
      security: []
      summary: Cached remote image (album cover / artist picture) by key (D60)
      description: |
        `key` is a hash of a CDN URL that Core itself returned (e.g. `cover.url` of
        online tracks/playlists, Subsonic `artistImageUrl`). Only allow-listed image
        hosts (NetEase, QQ, Kugou, Spotify, Cover Art Archive + `YIMENG_IMAGE_HOSTS`)
        are fetched; it is not an open proxy. Public (no token) because the content is
        public CDN imagery; rate limits apply. Fetched once, kept on disk (LRU, cap
        `YIMENG_IMAGE_CACHE_MB`, refresh after `YIMENG_IMAGE_CACHE_TTL_HOURS`), and
        served from cache when the platform is unreachable.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 2048 }, description: "120/300/600/1200 are pre-rendered" }
        - { name: format, in: query, schema: { type: string, enum: [jpeg, webp, png] } }
      responses:
        "200": { description: Image, headers: { ETag: { schema: { type: string } } }, content: { image/*: { schema: { type: string, format: binary } } } }
        "304": { description: Not modified }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/covers/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [catalog]
      summary: Cover image of a track/album/artist id. Signed URL (exp, dev, sig) or token. Strong ETag, immutable caching, 304.
      parameters:
        - { name: size, in: query, schema: { type: integer, enum: [120, 300, 600, 1200], default: 600 } }
        - { name: format, in: query, schema: { type: string, enum: [webp, jpeg] } }
      responses:
        "200": { description: image/webp or image/jpeg }
        "304": { description: Not modified }
        "401": { description: invalid_signature }
  /api/v1/covers/{id}/meta:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [catalog]
      summary: Cover placeholder data
      responses:
        "200": { description: "{blurhash, colors:[3 x #rrggbb]}" }
  /api/v1/me/playback:
    get:
      tags: [playback]
      summary: The caller's playback preferences (ReplayGain, gapless) — D53, applied client-side
      responses:
        "200": { description: Prefs, content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackPrefs" } } } }
    put:
      tags: [playback]
      summary: Update playback preferences (partial)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackPrefs" } } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackPrefs" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/me/source-switch:
    get:
      tags: [online]
      summary: The caller's cross-platform source switching preference (D50)
      responses:
        "200": { description: Preference, content: { application/json: { schema: { $ref: "#/components/schemas/SourceSwitch" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [online]
      summary: Update source switching (per account) — enabled and platform priority
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, priority: { type: array, items: { type: string } } } } } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/SourceSwitch" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/progress:
    get:
      tags: [userdata]
      summary: Playback progress (resume points) for the caller; ?ids=a,b or the 500 most recent. Does NOT write play history.
      parameters:
        - { name: ids, in: query, schema: { type: string } }
      responses:
        "200": { description: "{items:[{track_id, position_ms, duration_ms, finished, device_id, updated_at}]}" }
  /api/v1/progress/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [userdata]
      summary: Save progress; an older updated_at loses. Publishes progress.changed.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { position_ms: { type: integer }, duration_ms: { type: integer }, finished: { type: boolean }, updated_at: { type: string, format: date-time } } }
      responses: { "200": { description: Saved progress } }
    delete:
      tags: [userdata]
      summary: Clear progress
      responses: { "204": { description: Deleted } }
  /api/v1/artists/{id}/albums:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [catalog]
      summary: Albums of an artist (list envelope; default sort year desc)
      responses: { "200": { description: "{items, total, cursor, next_cursor, updated_at}" } }
  /api/v1/artists/{id}/tracks:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [catalog]
      summary: Tracks of an artist (list envelope)
      responses: { "200": { description: "{items, total, cursor, next_cursor, updated_at}" } }
  /api/v1/tracks/{id}/dream:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [catalog]
      summary: Reduced visual metadata - no audio analysis. colors/blurhash from the cover, tags from genre/platform tags, bpm only when a platform/tag provides it (else null). Online ids like netease:123 may be raw or %3A-encoded.
      responses: { "200": { description: "{track_id, colors:[3]|null, blurhash|null, tags:[string], bpm:null|number}" } }
  /api/v1/playlists/{id}/tracks:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [playlists]
      summary: Tracks of a playlist (paged list envelope plus playlist). Online playlist and chart ids (netease:123) are accepted.
      responses: { "200": { description: "{playlist, items, total, next_cursor}" } }
    post:
      tags: [playlists]
      summary: Add tracks - append, or insert at position / before / after a track id
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [track_ids], properties: { track_ids: { type: array, items: { type: string } }, position: { type: integer }, before: { type: string }, after: { type: string } } }
      responses: { "200": { description: Playlist } }
    put:
      tags: [playlists]
      summary: Reorder/replace - full ordered track_ids
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [track_ids], properties: { track_ids: { type: array, items: { type: string } } } }
      responses: { "200": { description: Playlist } }
    delete:
      tags: [playlists]
      summary: Remove by ?indexes=0,3 (0-based) or ?track_ids=a,b
      parameters:
        - { name: indexes, in: query, schema: { type: string } }
        - { name: track_ids, in: query, schema: { type: string } }
      responses: { "200": { description: Playlist } }
  /api/v1/online/{origin}/{sub}:
    parameters:
      - { name: origin, in: path, required: true, schema: { type: string, enum: [netease, qq, kugou] } }
      - { name: sub, in: path, required: true, schema: { type: string, enum: [daily, fm] } }
    get:
      tags: [online]
      summary: Platform pass-through only (no own recommendation). daily -> {origin, date, items:[Track]} (tracks is a deprecated alias of items); fm -> {origin, items} (no-store). 404 not_logged_in / not_supported.
      responses:
        "200": { description: Tracks }
        "404": { description: not_logged_in or not_supported }
  /api/v1/online/{origin}/fm/feedback:
    parameters: [{ name: origin, in: path, required: true, schema: { type: string } }]
    post:
      tags: [online]
      summary: Private FM feedback (like / trash) forwarded to the platform
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [track_id, action], properties: { track_id: { type: string }, action: { type: string, enum: [like, trash] } } }
      responses: { "204": { description: Forwarded }, "404": { description: not_logged_in or not_supported } }
  /api/v1/online/{origin}/recommend/playlists:
    parameters: [{ name: origin, in: path, required: true, schema: { type: string } }]
    get:
      tags: [online]
      summary: Platform's recommended playlists (login required)
      responses: { "200": { description: "{origin, items:[Playlist]}" }, "404": { description: not_logged_in } }
  /api/v1/online/{origin}/user/playlists:
    parameters: [{ name: origin, in: path, required: true, schema: { type: string } }]
    get:
      tags: [online]
      summary: Logged-in account's playlists; ?type=created|collected
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [created, collected] } }
      responses: { "200": { description: "{origin, items:[Playlist]}" }, "404": { description: not_logged_in } }
  # ---- P1: sessions, 一起听 rooms (D48) ----
  /api/v1/sessions:
    get:
      tags: [players]
      summary: The caller's sessions (devices of the same user) with presence and playback state
      responses: { "200": { description: "{items:[{device, current, online, state|null}]}" } }
  /api/v1/sessions/handoff:
    post:
      tags: [players]
      summary: Move playback (queue, track, position) between the caller's sessions; from defaults to the caller
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [to], properties: { from: { type: string }, to: { type: string } } }
      responses: { "200": { description: Destination player state }, "404": { description: Session not found } }
  /api/v1/rooms:
    get:
      tags: [rooms]
      summary: 一起听 rooms the caller is in (in-memory, ephemeral)
      responses: { "200": { description: "{items:[Room]}" } }
    post:
      tags: [rooms]
      summary: Create a room; the caller is host. Returns {id, code (6 chars), name, host, state, members, server_time, web_url}
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } } }
      responses: { "201": { description: Room } }
  /api/v1/rooms/{id}:
    parameters: [{ name: id, in: path, required: true, description: room id or 6-char code, schema: { type: string } }]
    get: { tags: [rooms], summary: Room, responses: { "200": { description: Room }, "404": { description: room_not_found } } }
  /api/v1/rooms/{id}/join:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { tags: [rooms], summary: Join by id or code (max 50 members), responses: { "200": { description: Room } } }
  /api/v1/rooms/{id}/leave:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { tags: [rooms], summary: Leave; a leaving host hands host to the oldest member, responses: { "204": { description: Left } } }
  /api/v1/rooms/{id}/state:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      tags: [rooms]
      summary: Host only - set {track_id, position_ms, playing}; broadcast as room.state with server_time
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { track_id: { type: string }, position_ms: { type: integer }, playing: { type: boolean } } }
      responses: { "200": { description: Room }, "403": { description: not_host } }
  /api/v1/rooms/{id}/danmaku:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { tags: [rooms], summary: Last 200 弹幕, responses: { "200": { description: "{items:[{id, device_id, name, text, track_id, t_ms, color, at}]}" } } }
    post:
      tags: [rooms]
      summary: Send 弹幕 (1-100 chars, max 5 per 10 s per device); t_ms defaults to the room position
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string }, t_ms: { type: integer }, color: { type: string, description: "#rrggbb" } } }
      responses: { "201": { description: Danmaku }, "429": { description: rate_limited } }
  /api/v1/rooms/{id}/events:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [rooms]
      summary: SSE for members - room.snapshot, room.state, room.danmaku, room.member_joined, room.member_left, room.host_changed. ?access_token= allowed.
      responses: { "200": { description: text/event-stream } }
  /room/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
    get:
      tags: [rooms]
      summary: Public web page for a room (uses the web UI's stored token)
      security: []
      responses: { "200": { description: text/html } }
  # ── Web console admin helpers (admin device; local library items only — online ids → 409 not_local) ──
  /api/v1/tracks/{id}/lyrics/user:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [admin]
      summary: The user-edited LRC stored for a local track (admin)
      responses: { "200": { description: "{lrc, offset_ms, updated_at}", content: { application/json: { schema: { type: object, properties: { lrc: { type: string }, offset_ms: { type: integer }, updated_at: { type: string, format: date-time } } } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/tracks/{id}/lyrics/search:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [admin]
      summary: Search LRCLIB lyric candidates for a local track (admin)
      parameters: [{ name: q, in: query, description: "Override query (default: title + artist)", schema: { type: string } }]
      responses: { "200": { description: "{items:[LyricsSearchCandidate]}", content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/LyricsSearchCandidate" } } } } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { description: not_local } }
  /api/v1/tracks/{id}/match:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [admin]
      summary: Metadata match candidates (MusicBrainz / Spotify …) for a local track (admin)
      responses: { "200": { description: "{items:[MetadataMatch]}", content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/MetadataMatch" } } } } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { description: not_local }, "503": { description: metadata lookup not configured } }
  /api/v1/albums/{id}/match:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [admin]
      summary: Metadata match candidates for a local album (admin)
      responses: { "200": { description: "{items:[MetadataMatch]}", content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/MetadataMatch" } } } } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { description: not_local }, "503": { description: metadata lookup not configured } }
  /api/v1/overrides/batch:
    post:
      tags: [admin]
      summary: Apply one metadata patch to many tracks or albums (≤ 1000 ids) (admin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [type, ids, patch], properties: { type: { type: string, enum: [track, album, artist] }, ids: { type: array, maxItems: 1000, items: { type: string } }, patch: { type: object, additionalProperties: true } } } } } }
      responses: { "200": { description: "{updated, skipped}" }, "400": { $ref: "#/components/responses/BadRequest" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/v1/system/logs:
    get:
      tags: [admin]
      summary: Recent Core log records from the in-memory ring (admin)
      parameters:
        - { name: after, in: query, description: "Return records with seq > after (polling)", schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 1000, default: 200 } }
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error] } }
      responses: { "200": { description: "{items:[{seq, time, level, msg, attrs}], last}" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/v1/settings/runtime:
    get:
      tags: [admin]
      summary: Runtime info for the dashboard (version, uptime, Go/SQLite versions, memory, goroutines) (admin)
      responses: { "200": { description: Runtime info, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/v1/recognize:
    post:
      tags: [recognize]
      summary: Identify a song from a short audio clip (网易云听歌识曲)
      description: |
        Multipart field `audio` (m4a/AAC preferred; also mp3/wav), optional `duration_ms`.
        `duration_ms` is an informational client hint only — Core always fingerprints
        using the server-measured PCM duration (overriding with a wrong hint caused
        false `no_match`). Limits: ≤15 s and ≤2 MiB (413 too_long). Rate limit
        10/min per account, enforced before decoding (429). Audio is never stored.
        Requires the caller's personal NetEase account to be logged in (409 not_logged_in); stream grants do not authorize recognition.
        Fingerprint is a clean-room reimplementation of NetEase shazam_v2 (D62); if the
        format NetEase expects changes, Core returns 503 fingerprint_unsupported.
        Each match `cover` is a CoverRef object (`{url, source_url, …}`), not a string.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary }
                duration_ms:
                  type: number
                  description: Informational hint only; ignored for fingerprint duration (Core measures PCM).
      responses:
        "200":
          description: "{matches:[RecognizeMatch]}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items: { $ref: "#/components/schemas/RecognizeMatch" }
        "400": { description: invalid_body }
        "404": { description: no_match }
        "409": { description: not_logged_in }
        "413": { description: too_long }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: fingerprint_unsupported }
  /api/v1/me/platform-bindings:
    get:
      tags: [sources]
      summary: Personal playback mode and grants (no donor account details for members)
      responses:
        "200": { description: Personal binding, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformBindings" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/stream-grants:
    get:
      tags: [sources]
      summary: List stream-only grants issued by this administrator
      responses:
        "200": { description: Grants, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/StreamGrant" } } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [sources]
      summary: Grant a member streaming through one of my saved accounts (admin user session)
      description: Replaces only this administrator's existing grant for that member/platform, increments its revision and cancels old streams. Never grants access to personal data. Does not fall back to another account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consumer_user_id, platform, account_id]
              properties:
                consumer_user_id: { type: string }
                platform: { type: string }
                account_id: { type: string, description: A saved account ID from my personal plugin account list }
                label: { type: string, maxLength: 80, description: Non-secret display name visible to the member }
      responses:
        "201": { description: Grant, content: { application/json: { schema: { $ref: "#/components/schemas/StreamGrant" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Another administrator already granted this member/platform, or plugin disabled }
  /api/v1/admin/stream-grants/{grant}:
    delete:
      tags: [sources]
      summary: Revoke my stream-only grant and cancel its active streams
      parameters: [{ name: grant, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/platform-legacy/claim:
    post:
      tags: [sources]
      summary: Explicitly claim quarantined legacy platform accounts as the current administrator
      description: Needed only when migration cannot identify one administrator. Copies and verifies credentials, commits ownership, then cleans legacy sessions. Never enables sharing.
      responses:
        "200": { description: Migration completed }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: "ymd_<base64url>" }
    queryToken: { type: apiKey, in: query, name: access_token }
    apiKey: { type: http, scheme: bearer, bearerFormat: "yk_<40 chars>", description: "Personal API key with scopes (D59); send as Bearer" }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Limit: { name: limit, in: query, description: "Page size; values above 500 are clamped to 500 (not an error). Values < 1 return 400.", schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Order: { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
    Q: { name: q, in: query, description: "Case-insensitive (ASCII) substring filter", schema: { type: string, maxLength: 200 } }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Missing / invalid / revoked device token, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Admin device required, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited:
      description: Too many attempts (pairing) or HTTP rate limit exceeded
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    StreamGrant:
      type: object
      required: [id, consumer_user_id, platform, label, revision, revoked, available]
      properties:
        id: { type: string }
        provider_user_id: { type: string, description: Administrator responses only }
        consumer_user_id: { type: string }
        platform: { type: string }
        account_id: { type: string, description: Administrator responses only }
        label: { type: string }
        revision: { type: integer }
        revoked: { type: boolean }
        available: { type: boolean, description: Local authorization and saved session are configured; upstream can still expire or refuse playback }
        unavailable_reason: { type: string }
    PlatformBindings:
      type: object
      required: [stream_mode, grants, legacy_claim_required]
      properties:
        stream_mode: { type: string, enum: [own, shared_required] }
        grants: { type: array, items: { $ref: "#/components/schemas/StreamGrant" } }
        legacy_claim_required: { type: boolean }
    MetadataMatch:
      type: object
      description: One provider candidate (web console metadata editor)
      properties:
        provider: { type: string }
        score: { type: number }
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        track_no: { type: integer }
        disc_no: { type: integer }
        year: { type: integer }
        duration_ms: { type: integer }
        isrc: { type: string }
        mb_recording_id: { type: string }
        mb_release_id: { type: string }
        label: { type: string }
        release_date: { type: string }
        upc: { type: string }
        cover_url: { type: string, description: "Provider image URL (do not load directly)" }
        preview_url: { type: string, description: "Same image via Core's cache (/api/v1/images/{key}, D60)" }
        popularity: { type: integer }
        genres: { type: array, items: { type: string } }
        track_count: { type: integer }
    DevCredential:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        username: { type: string, description: "Only in admin all=1 listings" }
        kind: { type: string, enum: [api_key, app_password] }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        prefix: { type: string, description: "First characters of the secret, for recognition" }
        allow_plain: { type: boolean }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
    RefreshSession:
      type: object
      properties:
        access_token: { type: string, description: "yma_… short-lived (15 min)" }
        refresh_token: { type: string, description: "ymd_… device token; rotated by /auth/refresh" }
        expires_in: { type: integer }
        token_type: { type: string, enum: [Bearer] }
    ServerInfo:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        api_version: { type: string }
        schema_version: { type: integer }
        authenticated: { type: boolean }
        features: { type: object, additionalProperties: { type: boolean } }
        platforms:
          type: array
          items:
            type: object
            properties:
              origin: { type: string }
              name: { type: string }
              enabled: { type: boolean }
              logged_in: { type: boolean }
              nickname: { type: string, description: Authenticated callers only }
              avatar_url: { type: string, description: "Platform account avatar (https), authenticated callers only (any role)" }
              vip: { type: boolean }
              capabilities: { type: array, items: { type: string, enum: [search, stream, lyrics, charts, daily, fm, recommend_playlists, user_playlists] } }
    RecognizeMatch:
      type: object
      required: [title]
      properties:
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        cover:
          allOf:
            - $ref: "#/components/schemas/CoverRef"
          description: CoverRef object (url/source_url/…); never a bare URL string
        origin: { type: string }
        track_id: { type: string }
        offset_ms: { type: integer }
    CoverRef:
      type: object
      properties:
        url: { type: string, description: "Signed /api/v1/covers/{id} URL; append &size=120|300|600|1200. For online items (D60): /api/v1/images/{key} (append ?size=) when the CDN host is allow-listed, else the CDN URL." }
        source_url: { type: string, description: "Online items only: the original CDN URL (D60)" }
        blurhash: { type: string, nullable: true }
        colors: { type: array, items: { type: string } }
    ListEnvelope:
      type: object
      properties:
        items: { type: array, items: {} }
        total: { type: integer }
        cursor: { type: string, nullable: true, description: opaque }
        next_cursor: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }
    LyricsScoreBreakdown:
      type: object
      description: Points per factor (max title 40, artist 30, album 5, duration 15, synced 5, translation 2, reliability 3). score = round(sum × penalty).
      properties:
        title: { type: number }
        artist: { type: number }
        album: { type: number }
        duration: { type: number }
        synced: { type: number }
        translation: { type: number }
        reliability: { type: number }
        duration_delta_ms: { type: integer, description: "-1 when unknown" }
        penalty: { type: number, description: "1 = none; 0.3 when the title does not match at all" }
    LyricsQuery:
      type: object
      properties: { title: { type: string }, artist: { type: string }, album: { type: string }, duration_ms: { type: integer }, isrc: { type: string } }
    LyricsSearchCandidate:
      type: object
      required: [id, provider, title, artist, synced, has_translation, score, preview]
      properties:
        id: { type: string, description: "provider-scoped ref, e.g. netease:123, lrclib:45, track:tr_… (local)" }
        provider: { type: string, enum: [user, local, lrclib, netease, qq, kugou] }
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        duration_ms: { type: integer }
        synced: { type: boolean }
        has_translation: { type: boolean }
        score: { type: integer, minimum: 0, maximum: 100 }
        score_breakdown: { $ref: "#/components/schemas/LyricsScoreBreakdown" }
        preview: { type: array, items: { type: string } }
    LyricsSearchResult:
      type: object
      required: [found, items]
      properties:
        query: { $ref: "#/components/schemas/LyricsQuery" }
        found: { type: boolean }
        message: { type: string, description: "present when found=false: 暂无歌词" }
        items: { type: array, items: { $ref: "#/components/schemas/LyricsSearchCandidate" } }
    LyricsBestLine:
      type: object
      required: [t_ms, text]
      properties: { t_ms: { type: integer }, text: { type: string }, trans: { type: string } }
    LyricsBest:
      type: object
      required: [found]
      properties:
        query: { $ref: "#/components/schemas/LyricsQuery" }
        found: { type: boolean }
        message: { type: string }
        id: { type: string }
        provider: { type: string }
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        duration_ms: { type: integer }
        synced: { type: boolean }
        score: { type: integer }
        score_breakdown: { $ref: "#/components/schemas/LyricsScoreBreakdown" }
        offset_ms: { type: integer }
        lrc: { type: string, description: synced LRC ("" when plain) }
        plain: { type: string }
        translation: { type: string, description: translated LRC with the same timestamps ("" if none) }
        romanization: { type: string, description: reserved; "" (no source provides it yet) }
        lines: { type: array, items: { $ref: "#/components/schemas/LyricsBestLine" } }
    ArtistImageCandidate:
      type: object
      properties: { provider: { type: string }, external_id: { type: string }, name: { type: string }, image_url: { type: string }, followers: { type: integer }, score: { type: number } }
    ImageCacheStats:
      type: object
      properties:
        files: { type: integer }
        bytes: { type: integer }
        max_bytes: { type: integer, description: "0 = unlimited" }
        originals: { type: integer, description: "Downloaded originals" }
        hits: { type: integer }
        misses: { type: integer }
        fetches: { type: integer }
        fetch_errors: { type: integer }
        stale_served: { type: integer, description: "Expired copies served while refreshing" }
        refreshes: { type: integer }
        evictions: { type: integer }
        hit_rate: { type: number }
        ttl_hours: { type: integer }
    CacheStats:
      type: object
      properties:
        entries: { type: integer }
        bytes: { type: integer }
        max_bytes: { type: integer }
        kinds:
          type: array
          items:
            type: object
            properties:
              origin: { type: string }
              kind: { type: string }
              entries: { type: integer }
              bytes: { type: integer }
              fresh: { type: integer }
              stale: { type: integer }
        counters:
          type: object
          description: Since start — hits, stale_served, misses, coalesced, negative_hits, errors, stale_on_error, evicted.
          additionalProperties: { type: integer }
    ServerSettings:
      type: object
      properties:
        watch_mode: { type: string, enum: [auto, fsnotify, poll, off] }
        rescan_interval: { type: string, description: 'Go duration, "0" = never' }
        musicbrainz_enabled: { type: boolean }
        musicbrainz_contact: { type: string }
        fill_sources: { type: array, items: { type: string, enum: [spotify, netease, qq, kugou, musicbrainz] }, description: "ordered; empty = background fill off (default)" }
        fill_per_minute: { type: integer, minimum: 1, maximum: 120 }
        time_zone: { type: string, example: Asia/Shanghai, description: "IANA zone used for reports (D55); seeded from YIMENG_TZ, default Asia/Shanghai" }
        cors_origins: { type: array, items: { type: string }, example: ["https://app.example.com"], description: "D59: browser origins allowed to call /api and /rest (`*` = any); seeded from YIMENG_CORS_ORIGINS; empty = no CORS" }
    ServerSettingsResponse:
      type: object
      properties:
        settings: { $ref: "#/components/schemas/ServerSettings" }
        fill_source_ids: { type: array, items: { type: string } }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        device_name: { type: string }
        device_type: { type: string, default: web }
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        nickname: { type: string, description: Defaults to username }
        avatar_url: { type: string, description: "Present when an avatar was uploaded" }
        role: { type: string, enum: [admin, user] }
        created_at: { type: string, format: date-time }
    Session:
      type: object
      properties:
        token: { type: string, description: "Bearer device token (shown once)" }
        device: { type: object }
        user: { $ref: "#/components/schemas/User" }
    Credit:
      type: object
      properties:
        track_id: { type: string }
        role: { type: string, example: "instrument (guitar)" }
        name: { type: string }
        mb_id: { type: string }
        source: { type: string, example: musicbrainz }
    TrackRef:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        artist_name: { type: string }
        album_id: { type: string }
        album_title: { type: string }
        duration_ms: { type: integer }
        replaygain: { $ref: "#/components/schemas/ReplayGain" }
    PlayerState:
      type: object
      properties:
        sleep:
          type: object
          nullable: true
          description: Armed sleep timer (D52)
          properties:
            until: { type: string, format: date-time, nullable: true }
            end_of_track: { type: boolean }
            fade_ms: { type: integer }
            fading: { type: boolean }
        player_id: { type: string }
        transport: { type: string, enum: [idle, buffering, playing, paused] }
        position_ms: { type: integer, description: "Extrapolated to updated_at while playing" }
        updated_at: { type: string, format: date-time }
        current_index: { type: integer, description: "-1 = none" }
        queue_length: { type: integer }
        repeat: { type: string, enum: [off, all, one] }
        shuffle: { type: boolean }
        online: { type: boolean, description: "true while the device holds an open /ws" }
        track: { oneOf: [{ $ref: "#/components/schemas/TrackRef" }, { type: "null" }] }
        lease: { oneOf: [{ $ref: "#/components/schemas/Lease" }, { type: "null" }] }
        next_index: { type: integer, description: "Queue index that plays after the current track ends naturally (repeat/shuffle aware); -1 = none" }
        next: { oneOf: [{ $ref: "#/components/schemas/TrackRef" }, { type: "null" }] }
        next_lease: { oneOf: [{ $ref: "#/components/schemas/Lease" }, { type: "null" }], description: "Prefetch hint for gapless playback" }
    Lease:
      type: object
      properties:
        delivery: { type: string, enum: [direct, proxy, client_sdk] }
        url: { type: string, example: /api/stream/tr_1a2b }
        format: { type: string }
        expires_at: { type: string, format: date-time }
    Queue:
      type: object
      properties:
        player_id: { type: string }
        current_index: { type: integer }
        shuffle: { type: boolean }
        play_order: { type: array, items: { type: integer }, description: "Queue indices in play order (identity when not shuffled)" }
        items:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/TrackRef" }
              - { type: object, properties: { index: { type: integer } } }
    PlayRequest:
      type: object
      additionalProperties: false
      properties:
        track_ids: { type: array, items: { type: string }, maxItems: 5000, description: Replace the queue }
        index: { type: integer, minimum: 0, description: Start at / jump to this queue index }
        position_ms: { type: integer, minimum: 0 }
    QueueOp:
      type: object
      required: [op]
      additionalProperties: false
      properties:
        op: { type: string, enum: [replace, append, insert, remove, move, clear] }
        track_ids: { type: array, items: { type: string } }
        index: { type: integer, description: "insert position / remove index" }
        from: { type: integer }
        to: { type: integer }
    SplitConfig:
      type: object
      additionalProperties: false
      description: |
        Always-on separators: ; ； 、 / ／ and feat./ft./featuring (featured role).
      properties:
        exceptions: { type: array, maxItems: 1000, items: { type: string, maxLength: 200 }, description: "Names never split (case-insensitive), e.g. AC/DC" }
        split_ampersand: { type: boolean, default: false, description: "Also split on & ＆" }
        split_comma: { type: boolean, default: false, description: "Also split on , ，" }
        extra_separators: { type: array, maxItems: 20, items: { type: string, maxLength: 8 }, description: 'Literal separators, spaces significant, e.g. " x "' }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: not_found }
        message: { type: string }
    PageMeta:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Device:
      type: object
      properties:
        id: { type: string, example: dev_0123abcd }
        name: { type: string }
        device_type: { type: string }
        created_at: { type: string, format: date-time }
        admin: { type: boolean, description: "Admin devices may use system/admin APIs. The first paired device is admin." }
        last_seen_at: { type: string, format: date-time }
    ScanJob:
      type: object
      properties:
        id: { type: string }
        roots: { type: array, items: { type: string } }
        status: { type: string, enum: [queued, running, completed, failed] }
        progress: { type: number, minimum: 0, maximum: 1 }
        total: { type: integer }
        processed: { type: integer }
        added: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        removed: { type: integer }
        failed: { type: integer }
        error: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ArtistRef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [primary, feat] }
    Artist:
      type: object
      properties:
        id: { type: string, example: ar_1a2b3c }
        image_updated_at: { type: string, format: date-time, description: "set when an admin chose an artist image (GET /api/artists/{id}/image)" }
        name: { type: string }
        sort_name: { type: string }
        mb_id: { type: string }
        album_count: { type: integer }
        track_count: { type: integer }
    Album:
      type: object
      properties:
        id: { type: string, example: al_1a2b3c }
        title: { type: string }
        artist_name: { type: string }
        artists: { type: array, items: { $ref: "#/components/schemas/ArtistRef" } }
        year: { type: integer }
        genre: { type: string }
        track_count: { type: integer }
        duration_ms: { type: integer }
        mb_release_id: { type: string }
        has_cover: { type: boolean }
        created_at: { type: string, format: date-time }
    Track:
      type: object
      properties:
        entitlement: { type: string, enum: [full, preview, unavailable], description: "Online tracks: full, preview (non-VIP plays the official preview only) or unavailable; for snapshots the last known platform state (D51). Playback still auto-switches (D50)." }
        alternatives: { type: array, items: { $ref: "#/components/schemas/Alternative" }, description: "Detail of a not-fully-playable online track only (D50)" }
        playable: { type: boolean, description: "false = cannot be played (see unplayable_reason)" }
        unplayable_reason: { type: string, nullable: true }
        preview: { type: object, nullable: true, description: "{start_ms, end_ms} of the official preview" }
        has_lyrics: { type: boolean }
        album: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }
        audio: { type: object, description: "{codec, sample_rate, bit_depth, channels, bitrate (kbps)}" }
        cover: { $ref: "#/components/schemas/CoverRef" }
        stream_url: { type: string, description: "Signed /api/v1/stream/{id} URL (signature excludes format/size)" }
        id: { type: string, example: tr_1a2b3c }
        title: { type: string }
        sort_letter: { type: string, description: "A–Z index key: uppercase first letter, pinyin initial for Chinese titles, '#' otherwise", example: Q }
        artist_name: { type: string }
        artists: { type: array, items: { $ref: "#/components/schemas/ArtistRef" } }
        album_id: { type: string }
        album_title: { type: string }
        disc_no: { type: integer }
        track_no: { type: integer }
        year: { type: integer }
        genre: { type: string }
        duration_ms: { type: integer }
        isrc: { type: string }
        mb_recording_id: { type: string }
        format: { type: string, example: flac }
        stream: { $ref: "#/components/schemas/StreamInfo" }
        play_count: { type: integer }
        last_played_at: { type: string, format: date-time }
        favorite: { type: boolean }
        rating: { type: integer, minimum: 1, maximum: 5 }
        created_at: { type: string, format: date-time }
    StreamInfo:
      type: object
      description: Properties of the source file that /api/stream serves as original (signal path)
      properties:
        format: { type: string, example: flac, description: container }
        codec: { type: string, example: flac, description: "flac | mp3 | aac | alac | opus | vorbis | pcm | unknown" }
        sample_rate: { type: integer, example: 96000 }
        bit_depth: { type: integer, example: 24, description: lossless only }
        channels: { type: integer, example: 2 }
        bitrate_kbps: { type: integer, description: average }
        lossless: { type: boolean }
        size_bytes: { type: integer }
        replaygain: { $ref: "#/components/schemas/ReplayGain" }
    ReplayGain:
      type: object
      description: "ReplayGain of the source file: gains in dB relative to -18 LUFS, peaks linear. Clients apply gain (+ clip prevention via peak); Core never alters audio."
      properties:
        track_gain: { type: number, example: -7.5 }
        track_peak: { type: number, example: 0.988 }
        album_gain: { type: number }
        album_peak: { type: number }
        source: { type: string, enum: [tag, analyzed] }
    StreamQuality:
      type: object
      properties:
        format: { type: string, enum: [original, aac, mp3, opus, flac] }
        bitrate_kbps: { type: integer }
        available:
          type: array
          description: Formats this server can produce now (original always)
          items:
            type: object
            properties:
              format: { type: string }
              lossless: { type: boolean }
              bitrates: { type: array, items: { type: integer } }
              default_bitrate: { type: integer }
    BackupInfo:
      type: object
      properties:
        name: { type: string, example: yimeng-20261021-120000-scheduled.ymbak }
        size: { type: integer }
        created_at: { type: string, format: date-time }
        reason: { type: string, example: "scheduled | manual | pre-migrate-5" }
    Lyrics:
      type: object
      properties:
        track_id: { type: string }
        source: { type: string, example: sidecar, description: "sidecar | embedded | provider name" }
        synced: { type: boolean }
        offset_ms: { type: integer }
        lines: { type: array, items: { type: object, properties: { time_ms: { type: integer }, text: { type: string } } } }
        text: { type: string }
        meta: { type: object, additionalProperties: { type: string } }
    BackupPolicy:
      type: object
      properties:
        enabled: { type: boolean }
        keep: { type: integer, minimum: 1, maximum: 60 }
        interval: { type: string, example: 24h0m0s }
        last_auto: { type: string, format: date-time, nullable: true }
        includes_key: { type: boolean, description: Always false; master.key is never in backups }
    SecurityAlert:
      type: object
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [device_paired, new_ip_login, login_failed, lockout] }
        severity: { type: string, enum: [info, warn, critical] }
        user_id: { type: string }
        device_id: { type: string }
        ip: { type: string }
        detail: { type: object }
        read: { type: boolean }
    MeProfile:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        nickname: { type: string, description: Defaults to username }
        avatar_url: { type: string, nullable: true, description: "Relative /api/v1/users/{id}/avatar?v=… or null" }
        role: { type: string, enum: [admin, user] }
    ReportEntry:
      type: object
      properties: { id: { type: string }, name: { type: string }, artist_name: { type: string }, plays: { type: integer }, listened_ms: { type: integer } }
    ListeningReport:
      type: object
      properties:
        period: { type: string, enum: [month, year] }
        year: { type: integer }
        month: { type: integer }
        tz: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        plays: { type: integer }
        listened_ms: { type: integer }
        unique_tracks: { type: integer }
        unique_artists: { type: integer }
        unique_albums: { type: integer }
        active_days: { type: integer }
        top_tracks: { type: array, items: { $ref: "#/components/schemas/ReportEntry" } }
        top_artists: { type: array, items: { $ref: "#/components/schemas/ReportEntry" } }
        top_albums: { type: array, items: { $ref: "#/components/schemas/ReportEntry" } }
        by_hour: { type: array, items: { type: integer }, minItems: 24, maxItems: 24 }
        by_weekday: { type: array, items: { type: integer }, minItems: 7, maxItems: 7, description: "0 = Monday" }
        by_day: { type: array, items: { type: integer }, description: "month: per day of month; year: per month (12)" }
    LastFMStatus:
      type: object
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        enabled: { type: boolean }
        username: { type: string }
        pending: { type: integer, description: Queued scrobbles }
    PlaybackPrefs:
      type: object
      properties:
        replaygain: { type: string, enum: [off, track, album], description: "default track" }
        preamp_db: { type: number, minimum: -15, maximum: 15 }
        prevent_clipping: { type: boolean, description: "cap gain at 1/peak (default true)" }
        gapless: { type: boolean, description: "preload the next track (default true)" }
    SourceSwitch:
      type: object
      properties:
        enabled: { type: boolean }
        priority: { type: array, items: { type: string }, description: "Platform ids, most preferred first" }
        platforms: { type: array, items: { type: string }, description: "Enabled platforms (read-only)" }
    Alternative:
      type: object
      properties:
        track_id: { type: string }
        origin: { type: string }
        title: { type: string }
        artist_name: { type: string }
        duration_ms: { type: integer }
        playable: { type: string, enum: [full, preview, unavailable] }
        score: { type: number }
        method: { type: string, enum: [isrc, meta] }
    Playlist:
      type: object
      properties:
        id: { type: string }
        owner_id: { type: string, description: "Owning user account (D49); empty on installs without accounts" }
        name: { type: string }
        comment: { type: string }
        smart: { type: boolean }
        rules: { $ref: "#/components/schemas/SmartRules" }
        track_count: { type: integer }
        duration_ms: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlaylistInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        comment: { type: string }
        track_ids: { type: array, items: { type: string }, maxItems: 10000 }
        rules: { $ref: "#/components/schemas/SmartRules" }
    SmartRules:
      type: object
      description: |
        Smart playlist rules, evaluated at read time.
        Text fields (title, artist, album, albumartist, genre, format, codec): is, is_not, contains, not_contains, starts_with.
        Number fields (year, duration [s], plays, rating, sample_rate, bit_depth): eq, ne, gt, gte, lt, lte, between [min,max].
        Date fields (added, last_played): in_last / not_in_last (days), before / after (RFC 3339).
        Bool fields (favorite, lossless): is true|false.
      example: { match: all, rules: [{ field: genre, op: contains, value: jazz }, { field: added, op: in_last, value: 30 }], sort: added, order: desc, limit: 100 }
      properties:
        match: { type: string, enum: [all, any], default: all }
        rules:
          type: array
          maxItems: 50
          items: { type: object, required: [field, op, value], properties: { field: { type: string }, op: { type: string }, value: {} } }
        sort: { type: string, description: "any /api/tracks sort, or random" }
        order: { type: string, enum: [asc, desc] }
        limit: { type: integer, maximum: 5000, default: 500 }
    FormatInfo:
      type: object
      properties:
        format: { type: string }
        lossless: { type: boolean }
        bitrates: { type: array, items: { type: integer } }
        default_bitrate: { type: integer }


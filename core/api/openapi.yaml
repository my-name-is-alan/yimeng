openapi: 3.1.0
info:
  title: 译梦 (yimeng) Core API
  version: 0.20.0
  description: |
    LAN API of the yimeng Core (NAS). Every `/api/*` route requires a device
    token (`Authorization: Bearer ymd_...`) except `POST /api/pair` and
    `POST /api/pair/request`. Media routes (`/api/stream/*`, `*/cover`) also
    accept `?access_token=` because `<audio>`/`<img>` cannot set headers.
    Errors use `{ "error": "<kind>", "message": "..." }`.

    Platform sessions are isolated by the authenticated Yimeng user (API 1.4).
    Each user's default platform account supplies their private library, recommendations,
    FM and feedback. Members stream only through an explicit administrator grant pinned
    to a concrete saved account; missing/revoked grants never fall back to another account.
    Existing plugin login/account URLs now act on the caller's own accounts, not a global session.
    A user login session (not an API key) is required to manage platform sessions or grants.
    Administrator plugin configuration remains global. Migration never creates grants.
    Optional TLS (`YIMENG_TLS_CERT`/`YIMENG_TLS_KEY`), trusted proxies
    (`YIMENG_TRUSTED_PROXIES` CIDRs → honour X-Forwarded-For), and rate limits
    (`YIMENG_RATE_LIMIT` req/s per client, `YIMENG_GLOBAL_RATE_LIMIT`) return 429
    with `Retry-After` when exceeded. `/healthz` is not rate-limited.
    Optional OpenSubsonic-compatible `/rest/*` (disable with `YIMENG_SUBSONIC=false`), see D59
    and `docs/developer-api.md`.

    **Developer API (D59).** Third-party apps use a personal API key
    (`Authorization: Bearer yk_…`) created under 设备/开发者. Keys carry scopes:
    `read` (all GET/HEAD), `playback` (players, queue, scrobble, rooms, stream),
    `library-write` (other writes: playlists, favorites, edits),
    `admin` (users, system, settings, sources, plugins; admin accounts only).
    A key without the needed scope gets `403 insufficient_scope`. Keys can never
    manage credentials, devices, sessions or Last.fm secrets.
    **Versioning:** the path prefix `/api/v1` is the major version; every response
    carries `X-Yimeng-API-Version` (minor). Within v1 changes are additive only;
    removals are announced with `deprecated: true` for at least one minor version first.
    **CORS:** browser origins must be listed in the runtime setting `cors_origins`
    (or `YIMENG_CORS_ORIGINS`, comma-separated); credentials are bearer tokens, so
    `Access-Control-Allow-Credentials` is never sent.
servers:
  - url: http://localhost:8741
  - url: http://nas.local:8741
security:
  - bearer: []
tags:
  - name: admin-ui
    description: Embedded browser admin
  - name: sources
    description: StreamSource account management (credentials never leave the vault)
  - name: subsonic
    description: OpenSubsonic-compatible /rest API
  - name: developer
    description: Personal API keys and Subsonic app passwords (D59)
  - name: system
  - name: pairing
  - name: library
  - name: catalog
  - name: media
  - name: settings
  - name: playback
  - name: metadata
  - name: history
  - name: playlists

paths:
  /healthz:
    get:
      tags: [system]
      security: []
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: yimeng-core }

  /api/v1/pair/request:
    post:
      tags: [pairing]
      security: []
      summary: Ask Core to print a new pairing code to its log (bootstrap for the first device)
      description: The code is never returned over HTTP. Rate-limited per client IP.
      responses:
        "202":
          description: Code printed in the Core log
          content:
            application/json:
              schema:
                type: object
                properties:
                  expires_at: { type: string, format: date-time }
                  message: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/setup:
    get:
      tags: [auth]
      summary: Whether first-run setup is needed (no web accounts exist yet). Public
      security: []
      responses:
        "200": { description: Setup state, content: { application/json: { schema: { type: object, properties: { needs_setup: { type: boolean } } } } } }
    post:
      tags: [auth]
      summary: Create the first admin account and sign in. Public, only while no account exists (409 setup_done afterwards)
      description: "Body {username, password, device_name?, device_type?}. Password policy: at least 10 characters, 3 of 4 character classes (or 16+ characters), not common, must not contain the username (400 weak_password). Passwords are stored as argon2id hashes."
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Credentials" } } }
      responses:
        "201": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { description: weak_password / invalid_username }
        "409": { description: setup_done }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Sign in with username and password; returns a device token (same bearer model as pairing). Public
      description: Failed attempts are limited per IP (8/min) and per username (5/min); exceeding either locks that key out for 15 minutes (429 with Retry-After).
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Credentials" } } }
      responses:
        "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { description: invalid_credentials }
        "429": { description: rate_limited }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the calling session's token
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: Change the signed-in user's password ({old_password, new_password}); the user's other sessions are revoked
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { old_password: { type: string }, new_password: { type: string } } } } }
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: wrong current password }
        "409": { description: not_a_user_session (device paired with a code) }

  /api/v1/users:
    get:
      tags: [auth]
      summary: List web accounts (admin)
      responses:
        "200": { description: Users, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/User" } } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [auth]
      summary: Create an account ({username, password, role admin|user}) (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "201": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "409": { description: username_taken }

  /api/v1/users/{id}:
    patch:
      tags: [auth]
      summary: Change role and/or set a new password (admin). Demoting the last admin fails (409 last_admin); a new password revokes that user's sessions
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { role: { type: string, enum: [admin, user] }, password: { type: string } } } } }
      responses:
        "200": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "409": { description: last_admin }
    delete:
      tags: [auth]
      summary: Delete an account and its sessions (admin; not the last admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/pair:
    post:
      tags: [pairing]
      security: []
      summary: Redeem a pairing code for a device token
      description: Codes are single-use and short-lived (default 5 min). 5 failures/min from one IP (or 30 globally) lock pairing for 15 minutes (logged at WARN). Tokens do not expire; revoke via DELETE /api/devices/{id}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, example: "ABCD-EF23", description: "Case-insensitive; dash optional" }
                name: { type: string, maxLength: 100, example: "宝英的 MacBook" }
                device_type: { type: string, maxLength: 32, example: desktop }
      responses:
        "201":
          description: Paired. The token is shown only once; store it securely.
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: "#/components/schemas/Device" }
                  token: { type: string, example: "ymd_..." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid or expired code
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/pair/codes:
    post:
      tags: [pairing]
      summary: Create a pairing code from an already-paired device (to show in its UI)
      responses:
        "201":
          description: New code
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/devices:
    get:
      tags: [pairing]
      summary: List paired devices
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Device" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/devices/me:
    get:
      tags: [pairing]
      summary: The device owning the presented token
      responses:
        "200": { description: Device, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/devices/me/stream-quality:
    get:
      tags: [media]
      summary: This device's default stream quality and the formats the server can produce
      responses:
        "200": { description: Quality, content: { application/json: { schema: { $ref: "#/components/schemas/StreamQuality" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [media]
      summary: Set this device's default stream quality (used when /api/stream has no format/bitrate query)
      description: Omitted bitrate selects the format's default preset. A format the server cannot currently produce is stored but streams fall back to the original.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              additionalProperties: false
              properties:
                format: { type: string, enum: [original, aac, mp3, opus, flac] }
                bitrate_kbps: { type: integer, description: "mp3 128|192|256|320 (320); aac 128|192|256 (256); opus 96|128|160|192 (160); not allowed for original/flac" }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/StreamQuality" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/devices/{id}:
    patch:
      tags: [pairing]
      summary: Rename a device and/or set admin (admin only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                admin: { type: boolean }
      responses:
        "200": { description: Updated device, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Cannot demote the last admin }
    delete:
      tags: [pairing]
      summary: Revoke a device (its token stops working immediately)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/library/scan:
    post:
      tags: [library]
      summary: Start a library scan (incremental by mtime/size unless full=true)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                root: { type: string, description: "Limit to a configured root or a sub-directory of one" }
                full: { type: boolean, default: false, description: "Re-read every file" }
      responses:
        "202":
          description: Scan started
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ScanJob" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: A scan is already running
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, const: scan_running }
                  job: { $ref: "#/components/schemas/ScanJob" }
    get:
      tags: [library]
      summary: Most recent scan job
      responses:
        "200": { description: Job, content: { application/json: { schema: { $ref: "#/components/schemas/ScanJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/library/scan/{id}:
    get:
      tags: [library]
      summary: Scan job status
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Job, content: { application/json: { schema: { $ref: "#/components/schemas/ScanJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/artists:
    get:
      tags: [catalog]
      summary: List artists
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Q"
        - { name: sort, in: query, schema: { type: string, enum: [name, albums, tracks], default: name } }
      responses:
        "200":
          description: Page of artists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties: { items: { type: array, items: { $ref: "#/components/schemas/Artist" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/artists/{id}:
    get:
      tags: [catalog]
      summary: Artist page (artist + albums + up to 20 tracks)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Artist page
          content:
            application/json:
              schema:
                type: object
                properties:
                  artist: { $ref: "#/components/schemas/Artist" }
                  albums: { type: array, items: { $ref: "#/components/schemas/Album" } }
                  tracks: { type: array, items: { $ref: "#/components/schemas/Track" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/albums:
    get:
      tags: [catalog]
      summary: List albums
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Q"
        - { name: sort, in: query, schema: { type: string, enum: [artist, title, year, added], default: artist } }
        - { name: favorite, in: query, schema: { type: boolean }, description: only favorites }
        - { name: artist_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Page of albums
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties: { items: { type: array, items: { $ref: "#/components/schemas/Album" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/albums/{id}:
    get:
      tags: [catalog]
      summary: Album page (album + tracks + credits + related albums)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Album page
          content:
            application/json:
              schema:
                type: object
                properties:
                  album: { $ref: "#/components/schemas/Album" }
                  tracks: { type: array, items: { $ref: "#/components/schemas/Track" } }
                  credits: { type: array, items: { $ref: "#/components/schemas/Credit" }, description: "Empty unless a metadata provider is enabled" }
                  related_albums: { type: array, items: { $ref: "#/components/schemas/Album" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/albums/{id}/cover:
    get:
      tags: [media]
      summary: Album cover image (optional sized thumbnail)
      description: Without size/format the original is served. With size (long edge, one of 120|300|600|1200; anything else → 400) a resized thumbnail is cached.
      security: [{ bearer: [] }, { queryToken: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: size, in: query, schema: { type: integer, enum: [120, 300, 600, 1200], default: 600 }, description: "Long edge in px; must be one of 120, 300, 600, 1200 — any other value returns 400" }
        - { name: format, in: query, schema: { type: string, enum: [jpeg, webp, png], default: jpeg } }
      responses:
        "200": { description: Image, content: { image/*: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      tags: [admin]
      summary: Upload a custom cover (image/jpeg|png|webp body, ≤ 10 MiB) for a local album; stored as an override (admin)
      requestBody: { required: true, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
      responses: { "204": { description: Saved }, "400": { $ref: "#/components/responses/BadRequest" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { description: not_local }, "413": { description: too large } }
    delete:
      tags: [admin]
      summary: Restore the album's original (file / fetched) cover (admin)
      responses: { "204": { description: Restored }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { description: not_local } }
  /api/v1/albums/{id}/cover/from-match:
    post:
      tags: [metadata]
      summary: Replace a local album's cover with a match candidate's image (admin)
      description: "Body {provider, url} from a /match candidate's cover_url. The provider downloads it (Spotify only accepts its image CDN) and it is stored like an uploaded cover (local edit; DELETE /api/albums/{id}/cover restores)."
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { provider: { type: string }, url: { type: string } } } } }
      responses:
        "200": { description: Album, content: { application/json: { schema: { $ref: "#/components/schemas/Album" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: Provider error }

  /api/v1/tracks:
    get:
      tags: [catalog]
      summary: List tracks
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Q"
        - { name: sort, in: query, schema: { type: string, enum: [title, artist, album, added, duration, year, track, plays, last_played, rating], default: title, description: "default is track when album_id is set" } }
        - { name: favorite, in: query, schema: { type: boolean }, description: only favorites }
        - { name: album_id, in: query, schema: { type: string } }
        - { name: artist_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Page of tracks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties: { items: { type: array, items: { $ref: "#/components/schemas/Track" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/tracks/{id}:
    get:
      tags: [catalog]
      summary: Track
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Track, content: { application/json: { schema: { $ref: "#/components/schemas/Track" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tracks/{id}/cover:
    get:
      tags: [media]
      summary: Track cover (embedded or folder art) (optional sized thumbnail)
      description: Without size/format the original is served. With size (long edge, one of 120|300|600|1200; anything else → 400) a resized thumbnail is cached.
      security: [{ bearer: [] }, { queryToken: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: size, in: query, schema: { type: integer, enum: [120, 300, 600, 1200], default: 600 }, description: "Long edge in px; must be one of 120, 300, 600, 1200 — any other value returns 400" }
        - { name: format, in: query, schema: { type: string, enum: [jpeg, webp, png], default: jpeg } }
      responses:
        "200": { description: Image, content: { image/*: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/search:
    get:
      tags: [catalog]
      summary: Search artists, albums and tracks (substring match). ?online=1 adds platform groups; ?stream=1 (or Accept text/event-stream) streams SSE events local, online (one per platform as it finishes), done
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: online, in: query, schema: { type: string, enum: ["1"] }, description: "Also search enabled online plugins in parallel; adds an `online` array grouped by platform" }
        - { name: origins, in: query, schema: { type: string }, description: "Comma-separated plugin ids to restrict the online search" }
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists: { type: array, items: { $ref: "#/components/schemas/Artist" } }
                  albums: { type: array, items: { $ref: "#/components/schemas/Album" } }
                  tracks: { type: array, items: { $ref: "#/components/schemas/Track" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/stream/{id}:
    get:
      tags: [media]
      summary: Stream a track, original or transcoded (GET and HEAD)
      description: |
        The file path is resolved from the database only and must lie inside a configured
        library root (symlinks resolved). Without `format`/`bitrate` the device's default
        stream quality applies (original if unset or not producible).

        * `original`: file bytes as stored; Range, ETag, Last-Modified, If-Range, If-None-Match.
        * Transcoded (requires ffmpeg on the server; otherwise 400 `format_unavailable`):
          a cached transcode is served like a file (Range etc.). A first-time transcode is
          streamed progressively while it is written to the cache: 200, chunked,
          `Accept-Ranges: none`, Range ignored. Re-request with Range once cached
          (HEAD shows `Accept-Ranges: bytes`). Cache keyed by track + source size/mtime +
          profile, LRU-evicted above YIMENG_CACHE_MAX_BYTES; concurrent transcodes limited.
        * Requests that cannot improve on the source (flac→flac, mp3/opus at ≥ source bitrate)
          serve the original. `X-Stream-Profile` names what was served (e.g. `mp3-320`, `original`).
      security: [{ bearer: [] }, { queryToken: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: format, in: query, schema: { type: string, enum: [original, aac, mp3, opus, flac] } }
        - { name: bitrate, in: query, description: "kbps preset; see stream-quality. Default per format.", schema: { type: integer } }
        - { name: Range, in: header, schema: { type: string, example: "bytes=0-" } }
        - { name: If-Range, in: header, schema: { type: string } }
      responses:
        "200":
          description: Whole file or progressive transcode
          headers:
            ETag: { schema: { type: string } }
            X-Stream-Profile: { schema: { type: string, example: mp3-320 } }
            Accept-Ranges: { schema: { type: string, enum: [bytes, none] } }
          content: { audio/*: { schema: { type: string, format: binary } } }
        "206": { description: Partial content (original or cached transcode), content: { audio/*: { schema: { type: string, format: binary } } } }
        "304": { description: Not modified (If-None-Match) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "416": { description: Range not satisfiable }
        "503": { description: Transcode could not be started, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/players:
    get:
      tags: [playback]
      summary: All players (paired devices) with their session state
      responses:
        "200":
          description: States
          content:
            application/json:
              schema:
                type: object
                properties: { items: { type: array, items: { $ref: "#/components/schemas/PlayerState" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/players/{id}:
    get:
      tags: [playback]
      summary: Player state
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: State, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerState" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/players/{id}/queue:
    get:
      tags: [playback]
      summary: Player queue
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Queue, content: { application/json: { schema: { $ref: "#/components/schemas/Queue" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [playback]
      summary: Edit the queue (replace | append | insert | remove | move | clear); current item follows its track
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/QueueOp" } } }
      responses:
        "200": { description: New state, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerState" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Queue is empty, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/players/{id}/play:
    post:
      tags: [playback]
      summary: "Play — replace queue (track_ids), jump (index) or resume"
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlayRequest" } } }
      responses:
        "200": { description: New state, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerState" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Queue is empty, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/players/{id}/pause:
    post:
      tags: [playback]
      summary: Pause (stores extrapolated position)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: New state, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerState" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Queue is empty, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/players/{id}/stop:
    post:
      tags: [playback]
      summary: Stop (idle, position 0)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: New state, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerState" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Queue is empty, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/players/{id}/next:
    post:
      tags: [playback]
      summary: Next track (wraps when repeat=all, else idle at end)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: New state, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerState" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Queue is empty, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/players/{id}/prev:
    post:
      tags: [playback]
      summary: Previous track (restarts current if > 3 s in)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: New state, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerState" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Queue is empty, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/players/{id}/seek:
    post:
      tags: [playback]
      summary: Seek (playing -> buffering)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [position_ms], properties: { position_ms: { type: integer, minimum: 0 } } } } }
      responses:
        "200": { description: New state, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerState" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Queue is empty, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/players/{id}/repeat:
    post:
      tags: [playback]
      summary: Set repeat mode
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [off, all, one] } } } } }
      responses:
        "200": { description: New state, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerState" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Queue is empty, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/players/{id}/shuffle:
    post:
      tags: [playback]
      summary: Toggle shuffle (a persisted play-order view; the queue itself is not reordered)
      description: |
        Enabling generates a new random play order (fresh seed) with the current track first.
        `reshuffle: true` while enabled generates a new order. Disabling continues in natural
        queue order from the current track. With repeat=all, wrapping past the last track
        reshuffles with a new seed. Queue edits keep the order consistent: `insert` places the
        new tracks right after the current one (play next), `append` spreads them randomly over
        the upcoming part, `move` keeps play order, `remove` of the current track continues at
        its play-order successor, `replace` reshuffles. Broadcasts player.state + queue.updated.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean }, reshuffle: { type: boolean, default: false } }
      responses:
        "200": { description: New state, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerState" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ws:
    get:
      tags: [playback]
      summary: WebSocket event stream
      security: [{ bearer: [] }, { queryToken: [] }]
      description: |
        Upgrade to WebSocket. Messages are JSON `{ "type": ..., "data": ... }`.
        Server → client: `hello` {device_id, players: PlayerState[]}, `player.state` (PlayerState),
        `queue.updated` (Queue), `scan.progress` (ScanJob), `metadata.patched` {entity_type, entity_id}, `pong`.
        Client → server: `player.progress` {player_id?, position_ms} (first report after buffering
        moves to playing; send every few seconds), `player.ended` {player_id?, track_id} (advances
        the queue; stale track ids are ignored), `ping`. player_id defaults to the caller's device.
        Slow consumers are disconnected (close 1013) and should reconnect and re-read state.
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/tracks/{id}/alternatives:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [online]
      summary: The same song on other enabled, logged-in platforms (D50)
      description: Matched by ISRC, or normalized title + artist with duration within ~3 s. Ordered by the caller's platform priority, fully entitled first. Online track detail embeds this as `alternatives` when the track is preview-only/unavailable (or with ?alternatives=1).
      responses:
        "200": { description: Alternatives, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Alternative" } } } } } } }

  /api/v1/tracks/{id}/credits:
    get:
      tags: [catalog]
      summary: Track credits (from opt-in metadata providers)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Credits
          content:
            application/json:
              schema:
                type: object
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Credit" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/metadata/enrich:
    post:
      tags: [metadata]
      summary: Schedule a background metadata pass (MusicBrainz; also runs after every scan)
      description: Tracks without an enrichment record are looked up by MBID → ISRC → search (score ≥ 0.9, duration ±3 s). Credits are stored; MBIDs/ISRC are only filled when missing; albums without local art get a Cover Art Archive cover. Progress arrives as WS `metadata.patched`.
      responses:
        "202": { description: Scheduled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: No provider enabled, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/settings/artist-split:
    get:
      tags: [settings]
      summary: Artist split policy
      responses:
        "200": { description: Policy, content: { application/json: { schema: { $ref: "#/components/schemas/SplitConfig" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [settings]
      summary: Replace the artist split policy (re-merges the library synchronously)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SplitConfig" } } }
      responses:
        "200": { description: Saved (normalized), content: { application/json: { schema: { $ref: "#/components/schemas/SplitConfig" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/system/backups:
    get:
      tags: [system]
      summary: List stored backups (admin)
      responses:
        "200": { description: Backups, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/BackupInfo" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [system]
      summary: Create a backup now (admin). VACUUM INTO snapshot zipped; never contains the master key.
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/BackupInfo" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/system/backups/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string, pattern: '^yimeng-[0-9]{8}-[0-9]{6}(-[a-z0-9-]{1,32})?\.ymbak$' } }]
    get:
      tags: [system]
      summary: Download a stored backup (admin)
      responses:
        "200": { description: Zip archive, content: { application/zip: { schema: { type: string, format: binary } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [system]
      summary: Delete a stored backup (admin)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/system/backups/policy:
    get:
      tags: [system]
      summary: Automatic backup policy (admin, D54)
      responses:
        "200": { description: Policy, content: { application/json: { schema: { $ref: "#/components/schemas/BackupPolicy" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [system]
      summary: Update the automatic backup policy (admin). Only automatic backups rotate; manual and pre-migration backups are kept.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, keep: { type: integer, minimum: 1, maximum: 60 } } } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/BackupPolicy" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/system/backups/{name}/restore:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    post:
      tags: [system]
      summary: Stage a stored backup for restore (admin). Applied at the next Core restart; the current DB is kept as .pre-restore-*.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [confirm], properties: { confirm: { type: string, description: Must equal the backup name } } } } }
      responses:
        "202": { description: Staged, content: { application/json: { schema: { type: object, properties: { restart_required: { type: boolean }, manifest: { type: object }, message: { type: string } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/security/alerts:
    get:
      tags: [security]
      summary: Security alerts (D54). Admins see all; users see their own account's. Live as the `security.alert` event.
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }]
      responses:
        "200": { description: Alerts, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/SecurityAlert" } }, unread: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/security/alerts/read:
    post:
      tags: [security]
      summary: Mark alerts read (ids omitted = all visible to the caller)
      requestBody:
        content: { application/json: { schema: { type: object, properties: { ids: { type: array, maxItems: 500, items: { type: integer } } } } } }
      responses:
        "204": { description: Marked }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/me/report:
    get:
      tags: [me]
      summary: Listening report (D55) for one month or year, computed only from the caller's own plays
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [month, year], default: month } }
        - { name: year, in: query, schema: { type: integer }, description: "Default: current year in tz" }
        - { name: month, in: query, schema: { type: integer, minimum: 1, maximum: 12 }, description: "Default: current month; ignored for period=year" }
        - { name: tz, in: query, schema: { type: string, example: Asia/Shanghai }, description: "IANA zone for bucketing; default is the server's configured time_zone (runtime setting / YIMENG_TZ, default Asia/Shanghai). The zone used is echoed in `tz`." }
        - { name: top, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200": { description: Report, content: { application/json: { schema: { $ref: "#/components/schemas/ListeningReport" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/lastfm:
    get:
      tags: [me]
      summary: "Last.fm status for the caller's account (D56). Keys and session are never returned."
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/LastFMStatus" } } } }
        "403": { description: "account_required — devices without an account cannot use Last.fm" }
        "501": { description: Not configured }
    put:
      tags: [me]
      summary: Pause or resume scrobbling (keeps the session)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/LastFMStatus" } } } }
        "409": { description: lastfm_not_authorized }
    delete:
      tags: [me]
      summary: Disconnect; deletes keys, session and queued scrobbles
      responses:
        "204": { description: Removed }

  /api/v1/me/lastfm/keys:
    put:
      tags: [me]
      summary: "Save the account's own Last.fm API key and shared secret (write-only, stored encrypted in the Vault). Clears any session."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [api_key, api_secret], properties: { api_key: { type: string, pattern: "^[0-9a-f]{32}$" }, api_secret: { type: string, pattern: "^[0-9a-f]{32}$" } } } } } }
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/LastFMStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/me/lastfm/auth:
    post:
      tags: [me]
      summary: "Start the Last.fm desktop auth flow; open auth_url in a browser, grant access, then call /auth/complete"
      responses:
        "200": { description: Auth URL, content: { application/json: { schema: { type: object, properties: { auth_url: { type: string } } } } } }
        "409": { description: lastfm_no_keys }
        "502": { description: lastfm_error / lastfm_unreachable }

  /api/v1/me/lastfm/auth/complete:
    post:
      tags: [me]
      summary: Exchange the granted token for a session; scrobbling starts
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/LastFMStatus" } } } }
        "409": { description: "lastfm_no_token or lastfm_not_authorized (user has not granted access yet)" }

  /api/v1/me:
    get:
      tags: [me]
      summary: The caller's account profile
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/MeProfile" } } } }
        "403": { description: account_required — device not signed in to an account }
    patch:
      tags: [me]
      summary: Update the caller's nickname ("" = use the username)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nickname], properties: { nickname: { type: string, maxLength: 32 } } } } } }
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/MeProfile" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/me/avatar:
    put:
      tags: [me]
      summary: "Upload the caller's avatar: raw JPEG, PNG or WebP body, at most 1 MiB and 4096×4096 px. Stored in the Core database (included in backups)."
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { description: invalid_image (dimensions) }
        "413": { description: too_large }
        "415": { description: unsupported_type }
    delete:
      tags: [me]
      summary: Remove the caller's avatar
      responses:
        "204": { description: Removed }

  /api/v1/users/{id}/avatar:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [users]
      summary: An account's avatar image (any authenticated device; also accepts ?access_token= for <img>). Use the avatar_url from /me or /users.
      security: [{ bearer: [] }, { queryToken: [] }]
      responses:
        "200": { description: Image, content: { image/*: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [users]
      summary: Set an account's avatar (admin); same limits as PUT /me/avatar
      requestBody: { required: true, content: { image/*: { schema: { type: string, format: binary } } } }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      summary: Remove an account's avatar (admin)
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/system/export:
    get:
      tags: [system]
      summary: Stream a fresh backup archive (admin)
      description: Zip with library.db (VACUUM INTO; vault entries stay AES-256-GCM encrypted) and manifest.json. include_key=true adds the vault master key — the archive then decrypts stored credentials.
      parameters: [{ name: include_key, in: query, schema: { type: boolean, default: false } }]
      responses:
        "200": { description: Zip archive, content: { application/zip: { schema: { type: string, format: binary } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/system/restore:
    post:
      tags: [system]
      summary: Upload a backup archive to restore (admin); applied at the next start
      description: The archive is validated (manifest, SQLite integrity_check, schema not newer than this Core) and staged. On the next start the current database is kept as `*.pre-restore-<ts>` and the staged one swapped in, then migrations run (with an automatic pre-migration backup).
      requestBody: { required: true, content: { application/zip: { schema: { type: string, format: binary } } } }
      responses:
        "202": { description: Staged; restart required, content: { application/json: { schema: { type: object, properties: { restart_required: { type: boolean }, message: { type: string }, manifest: { type: object } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/tracks/{id}/lyrics:
    get:
      tags: [catalog]
      summary: Lyrics for a track (synced LRC or plain)
      description: "Resolution: sidecar `<file>.lrc` beside the audio file (read on demand, inside library roots, GB18030 auto-detected) → embedded tag (USLT / LYRICS / UNSYNCEDLYRICS / ©lyr) → optional remote provider. Synced lyrics are preferred. LRC [offset] is already applied to time_ms."
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Lyrics, content: { application/json: { schema: { $ref: "#/components/schemas/Lyrics" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Track not found (not_found) or no lyrics (no_lyrics)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

    put:
      tags: [admin]
      summary: Save user lyrics (LRC text) for a local track; overrides fetched lyrics (admin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [lrc], properties: { lrc: { type: string, maxLength: 262144 }, offset_ms: { type: integer } } } } } }
      responses: { "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Lyrics" } } } }, "400": { $ref: "#/components/responses/BadRequest" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { description: not_local (online track) } }
    delete:
      tags: [admin]
      summary: Remove user lyrics (falls back to file / fetched lyrics) (admin)
      responses: { "204": { description: Removed }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { description: not_local } }
  /api/v1/lyrics/search:
    get:
      tags: [lyrics]
      summary: Lyrics candidates for ANY song (paired apps)
      description: |
        Also served as `/api/v1/lyrics/search`. Any paired device or signed-in user (not admin-only). The song does not have to be in the library.
        Local/user-bound lyrics (library tracks matching the title or ISRC) and every remote lyrics source (LRCLIB, NetEase, QQ, Kugou) are queried
        in parallel with per-source timeouts (whole lookup ≤ 15 s; partial results are returned). Candidates are scored 0–100 by the shared
        scorer (also used by the web lyrics workbench) and sorted best first. Results are cached (6 h; empty results 30 min; header `X-Yimeng-Cache: hit|miss`).
        Cache misses are rate-limited per client (30/min, burst 10) → 429 with Retry-After. No lyrics → 200 `{found:false, message:"暂无歌词"}`.
      parameters:
        - { name: title, in: query, required: true, schema: { type: string } }
        - { name: artist, in: query, schema: { type: string } }
        - { name: album, in: query, schema: { type: string } }
        - { name: duration, in: query, description: seconds (may be fractional), schema: { type: number } }
        - { name: duration_ms, in: query, description: alternative to duration, schema: { type: integer } }
        - { name: isrc, in: query, description: used to match library tracks, schema: { type: string } }
      responses:
        "200": { description: Ranked candidates (lyric text omitted; preview = first lines), content: { application/json: { schema: { $ref: "#/components/schemas/LyricsSearchResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: rate_limited, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/lyrics/best:
    get:
      tags: [lyrics]
      summary: The single best lyrics for ANY song, with text, offset and translation
      description: Same lookup, cache and limits as /api/lyrics/search (shares its cache). Returns `found:false` + `message` when nothing scores ≥ min_score (default 50).
      parameters:
        - { name: title, in: query, required: true, schema: { type: string } }
        - { name: artist, in: query, schema: { type: string } }
        - { name: album, in: query, schema: { type: string } }
        - { name: duration, in: query, schema: { type: number } }
        - { name: duration_ms, in: query, schema: { type: integer } }
        - { name: isrc, in: query, schema: { type: string } }
        - { name: min_score, in: query, schema: { type: integer, minimum: 0, maximum: 100, default: 50 } }
      responses:
        "200": { description: Best lyrics or found=false, content: { application/json: { schema: { $ref: "#/components/schemas/LyricsBest" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: rate_limited, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/artists/{id}/image:
    get:
      tags: [catalog]
      summary: Artist image (local or online artist), served from the image cache (D60)
      description: |
        Resolution order: image uploaded by an admin → online artist picture
        (NetEase/QQ/Kugou; remembered so it still works during platform risk
        control) → picture auto-matched from metadata providers (exact name match
        only, background, `YIMENG_ARTIST_IMAGE_AUTO=false` disables) → the artist's
        newest album cover. `?access_token=` / signed URLs are accepted (for <img>).
        404 when nothing is available.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 2048 }, description: "Long edge in px; 120/300/600/1200 are pre-rendered" }
        - { name: format, in: query, schema: { type: string, enum: [jpeg, webp, png] } }
      responses:
        "200": { description: Image bytes, content: { image/*: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [catalog]
      summary: Upload an artist image (admin, local artists only; survives rescans)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
      responses:
        "200": { description: Updated artist, content: { application/json: { schema: { $ref: "#/components/schemas/Artist" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: not_local_source (online artists are read-only), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [catalog]
      summary: Remove the artist image (admin)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: not_local_source, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/artists/{id}/image/candidates:
    get:
      tags: [catalog]
      summary: Artist image candidates from metadata sources (admin)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: name, in: query, description: override the search name, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { description: Candidates, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ArtistImageCandidate" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: provider_error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/artists/{id}/image/from-match:
    post:
      tags: [catalog]
      summary: Set the artist image from a candidate (admin; Core downloads it from an allow-listed host)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [provider, url], properties: { provider: { type: string }, url: { type: string } } } } } }
      responses:
        "200": { description: Updated artist, content: { application/json: { schema: { $ref: "#/components/schemas/Artist" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: provider_error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/settings/cache:
    get:
      summary: Platform cache stats plus image cache stats (admin)
      tags: [settings]
      responses:
        "200":
          description: Stats (platform cache fields at top level, image cache under `images`)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/CacheStats" }
                  - type: object
                    properties:
                      images: { $ref: "#/components/schemas/ImageCacheStats" }
    delete:
      summary: Clear platform cache entries, or the image cache with kind=images (admin)
      tags: [settings]
      parameters:
        - { name: origin, in: query, schema: { type: string }, description: "netease|qq|kugou… (empty = all)" }
        - { name: kind, in: query, schema: { type: string }, description: "charts|playlist|album|… (empty = all); `images` clears cached covers/artist pictures (URL records are kept, images re-download on demand)" }
      responses:
        "200":
          description: Deleted count
          content:
            application/json:
              schema: { type: object, properties: { deleted: { type: integer } } }
  /api/v1/settings/server:
    get:
      tags: [settings]
      summary: Runtime-editable server settings (admin)
      responses:
        "200": { description: Current settings, content: { application/json: { schema: { $ref: "#/components/schemas/ServerSettingsResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [settings]
      summary: Patch server settings (admin; applied live, no restart)
      description: Partial JSON; omitted fields keep their value. Watcher, rescan timer, MusicBrainz enrichment and the background metadata filler restart with the new values. Emits `settings.updated`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ServerSettings" } } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/ServerSettingsResponse" } } } }
        "400": { description: invalid_settings, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/scrobble:
    post:
      tags: [history]
      summary: Record a play reported by a client that played the track itself
      description: "Plays from Core-managed players are recorded automatically when a track is left after ≥50% / 4 min (or ended). Scrobbles are stored as-is, per account (D49). Online ids (netease:…, qq:…) are accepted: a snapshot of the track (title, artists, album, cover, duration) is stored so history / 最近播放 / 常听 keep working."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_id]
              properties:
                track_id: { type: string }
                played_at: { type: string, format: date-time, description: "default now; must not be in the future" }
                duration_ms: { type: integer, description: listened duration }
                completed: { type: boolean }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/history:
    get:
      tags: [history]
      summary: Listening history, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - { name: player_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        track_id: { type: string }
                        player_id: { type: string }
                        played_at: { type: string, format: date-time }
                        duration_ms: { type: integer }
                        completed: { type: boolean }
                        source: { type: string, enum: [core, scrobble, subsonic] }
                        title: { type: string }
                        artist_name: { type: string }
                        album_id: { type: string }
                        album_title: { type: string }
                        available: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/history/top:
    get:
      tags: [history]
      summary: Most played tracks, albums or artists
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [track, album, artist], default: track } }
        - { name: period, in: query, schema: { type: string, enum: [7d, 30d, 90d, 365d, all], default: all } }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Ranking
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, artist_name: { type: string }, plays: { type: integer } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/favorites:
    get:
      tags: [history]
      summary: Favorites (newest first)
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [track, album, artist] } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Favorites
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object, properties: { type: { type: string }, id: { type: string }, name: { type: string }, created_at: { type: string, format: date-time }, available: { type: boolean } } } }

  /api/v1/favorites/{type}/{id}:
    parameters:
      - { name: type, in: path, required: true, schema: { type: string, enum: [track, album, artist] } }
      - $ref: "#/components/parameters/Id"
    put:
      tags: [history]
      summary: Mark as favorite (event favorite.changed)
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [history]
      summary: Remove favorite
      responses:
        "204": { description: Done }

  /api/v1/ratings/{type}/{id}:
    parameters:
      - { name: type, in: path, required: true, schema: { type: string, enum: [track, album, artist] } }
      - $ref: "#/components/parameters/Id"
    put:
      tags: [history]
      summary: Set a 1-5 rating; 0 clears (event rating.changed)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [rating], properties: { rating: { type: integer, minimum: 0, maximum: 5 } } } } } }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/playlists:
    get:
      tags: [playlists]
      summary: The caller's playlists (static and smart) with counts. With ?scope=mine|recommend|discover|charts returns external playlists grouped by platform ({scope, groups}); scope=all|online also returns a flat paged items list (local first).
      description: Per account (D49) — only the caller's own playlists are listed; other accounts' playlists are 404 everywhere. Paged with limit + cursor; next_cursor is null on the last page.
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [local, all, online, mine, recommend, discover, charts] } }
        - { name: origin, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 }, description: "Values above 500 are clamped to 500" }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Playlists, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Playlist" } }, total: { type: integer }, next_cursor: { type: string, nullable: true }, cursor: { type: string, nullable: true, deprecated: true, description: "Deprecated — echo of the request cursor; use next_cursor. Still returned for now." }, groups: { type: array, items: { type: object }, deprecated: true, description: "Deprecated — per-platform grouping for scope=mine|recommend|discover|charts. Still returned for now; prefer the flat items list." } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [playlists]
      summary: Create a static (track_ids) or smart (rules) playlist
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/playlists/import:
    post:
      tags: [playlists]
      summary: Import an M3U/M3U8 playlist (≤4 MiB) as a static playlist
      description: Entries are matched against the library only (referenced files are never opened) — exact path, path relative to a library root, unique file name, then `#EXTINF` "artist - title".
      parameters: [{ name: name, in: query, schema: { type: string } }]
      requestBody: { required: true, content: { audio/x-mpegurl: { schema: { type: string } } } }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlist: { $ref: "#/components/schemas/Playlist" }
                  matched: { type: integer }
                  unmatched: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/playlists/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [playlists]
      summary: Playlist with a page of tracks (smart playlists are evaluated now)
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: Playlist
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Playlist" }
                  - type: object
                    properties:
                      missing: { type: integer, description: "static items whose track is currently not in the library" }
                      tracks: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Track" } }, total: { type: integer }, limit: { type: integer }, offset: { type: integer } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [playlists]
      summary: Rename / comment / change rules (smart only)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [playlists]
      summary: Delete a playlist
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/playlists/{id}/items:
    post:
      tags: [playlists]
      summary: Edit items of a static playlist (event playlist.updated)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [op]
              properties:
                op: { type: string, enum: [replace, append, insert, remove, move, clear] }
                track_ids: { type: array, items: { type: string } }
                index: { type: integer }
                from: { type: integer }
                to: { type: integer }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Smart playlists have no editable items, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/playlists/{id}/m3u:
    get:
      tags: [playlists]
      summary: Export as extended M3U (UTF-8)
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: paths, in: query, schema: { type: string, enum: [absolute, relative], default: absolute }, description: "relative = relative to the file's library root" }
      responses:
        "200": { description: M3U, content: { audio/x-mpegurl: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/system:
    get:
      tags: [system]
      summary: Version, library stats, scan state, ffmpeg/loudness caps, root diagnostics
      description: |
        Non-admin callers get only `{version, api_version}` (no os, uptime, library stats or diagnostics). Everything below applies to admins.
        Available to every paired device. Reports version/uptime, library counts, latest scan,
        per-root reachability and free space, database size, transcoder formats and cache size,
        loudness analysis queue, backup freshness, and self-diagnostics (permission errors,
        low disk, low inotify watches, missing ffmpeg, stale backups). Query strings are never
        written to the access log (tokens live there for media).
      responses:
        "200":
          description: System info
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  go_version: { type: string }
                  os: { type: string }
                  arch: { type: string }
                  started_at: { type: string, format: date-time }
                  uptime_sec: { type: integer }
                  schema_version: { type: integer }
                  library:
                    type: object
                    properties:
                      tracks: { type: integer }
                      albums: { type: integer }
                      artists: { type: integer }
                      files: { type: integer }
                      lossless_files: { type: integer }
                      playlists: { type: integer }
                      plays: { type: integer }
                      duration_ms: { type: integer }
                      bytes: { type: integer }
                  scan: { type: object, description: latest scan job, nullable: true }
                  roots:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
                        files: { type: integer }
                        free_bytes: { type: integer }
                  database:
                    type: object
                    properties:
                      size_bytes: { type: integer }
                      wal_bytes: { type: integer }
                      free_bytes: { type: integer }
                  transcode:
                    type: object
                    properties:
                      available: { type: boolean }
                      formats: { type: array, items: { $ref: "#/components/schemas/FormatInfo" } }
                      cache_bytes: { type: integer }
                      cache_max_bytes: { type: integer }
                  loudness:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      pending: { type: integer }
                      failed: { type: integer }
                  backups:
                    type: object
                    properties:
                      count: { type: integer }
                      last: { type: string, format: date-time, nullable: true }
                  devices:
                    type: object
                    properties:
                      paired: { type: integer }
                      active_24h: { type: integer }
                  features: { type: object, additionalProperties: { type: boolean } }
                  diagnostics:
                    type: array
                    items:
                      type: object
                      properties:
                        level: { type: string, enum: [info, warn, error] }
                        code: { type: string }
                        message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/players/{id}/transfer:
    post:
      tags: [playback]
      summary: Move the queue and playhead to another player
      description: |
        The destination receives the queue, shuffle order, repeat mode, current index and
        position. If the source was playing it arrives paused (the new device resumes).
        The source becomes idle with an empty queue. Publishes player.transferred plus
        player.state / queue.updated for both players. Devices with an open /ws are marked
        online (device.online / device.offline events; hello includes the online set).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties: { to: { type: string, description: destination player/device id } }
      responses:
        "200": { description: Destination state, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerState" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Source queue empty, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }


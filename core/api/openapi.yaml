        `metadata.providers` / `YIMENG_PROVIDERS` and consulted by
        `GET /api/tracks/{id}/lyrics` when no local/embedded lyrics exist.
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, capabilities, health]
                      properties:
                        id: { type: string }
                        capabilities: { type: integer, description: "Capability bitset (CapTrackTags=1, CapAlbumInfo=2, …)" }
                        health: { type: string, enum: [ok, degraded, down] }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/tracks/{id}/download:
    get:
      tags: [library]
      summary: Download a track for offline caching
      description: |
        Serves the library original (or an optional transcode via `format`/`bitrate`)
        with `Content-Disposition: attachment`. Prefers a complete file with
        Content-Length and Range support — transcodes are materialized into the
        cache before the response body starts. Query `access_token` is allowed
        (same as stream/cover) for download managers that cannot set headers.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: format, in: query, schema: { type: string, enum: [original, aac, mp3, opus, flac] } }
        - { name: bitrate, in: query, schema: { type: integer } }
        - { name: access_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: Audio file
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Download-Profile: { schema: { type: string } }
          content:
            audio/*: { schema: { type: string, format: binary } }
            application/octet-stream: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Transcode failed }

  /rest/ping.view:
    get:
      tags: [subsonic]
      summary: OpenSubsonic ping (the whole /rest surface follows the Subsonic 1.16.1 / OpenSubsonic spec)
      description: |
        Every endpoint answers at `/rest/<name>` and `/rest/<name>.view`, GET or POST
        (form body; `formPost` extension). Responses are XML, or JSON with `f=json`;
        errors are HTTP 200 with `status="failed"` and a Subsonic error code.

        Endpoints: ping, getLicense, getOpenSubsonicExtensions, getMusicFolders,
        getIndexes, getArtists, getArtist, getAlbum, getSong, getAlbumList2 (getAlbumList),
        search3 (search2), getPlaylists, getPlaylist, createPlaylist, updatePlaylist,
        deletePlaylist, star, unstar, getStarred2 (getStarred), scrobble, stream, download,
        getCoverArt (album, track and `ar-<artist id>`), getArtistInfo2 (getArtistInfo),
        getAlbumInfo2 (getAlbumInfo), getLyrics, getLyricsBySongId, getUser, savePlayQueue, getPlayQueue.
        Artists carry `coverArt: ar-<id>`; `artistImageUrl` / `*ImageUrl` are absolute
        `/api/v1/images/{key}` URLs when a cached remote picture exists.

        Auth (one of):
        - `apiKey=yk_…` (extension apiKeyAuthentication; sending `u` too → error 43, bad key → 44)
        - `u` + `t=md5(app_password + s)` + `s` with a per-account **app password**
          (never the login password)
        - `u` + `p=<app password>` / `p=enc:<hex>` only if that app password has
          `allow_plain` (default off → error 41)
        - legacy: `p=<ymd_ device token>` or `Authorization: Bearer`
        10 failures per user+IP in 15 min lock that pair out (error 40) and raise a security alert.
        Scopes: browsing = read; stream/download/scrobble/play queue = playback;
        playlist writes and stars = library-write (missing → error 50).
        Online tracks that are preview-only or unavailable are omitted from listings;
        `stream` of a preview-only track is refused (HTTP 403 `preview_only`) — no 30 s clips, no DRM bypass.
      parameters:
        - { name: apiKey, in: query, schema: { type: string } }
        - { name: u, in: query, schema: { type: string } }
        - { name: t, in: query, schema: { type: string }, description: "md5(app_password + s), hex" }
        - { name: s, in: query, schema: { type: string } }
        - { name: p, in: query, schema: { type: string }, description: "app password (only if allow_plain) or ymd_ device token" }
        - { name: v, in: query, schema: { type: string } }
        - { name: c, in: query, schema: { type: string } }
        - { name: f, in: query, schema: { type: string, enum: [xml, json, jsonp] } }
      security: []
      responses:
        "200": { description: "subsonic-response envelope" }

  /api/v1/developer/credentials:
    get:
      tags: [developer]
      summary: List my API keys and app passwords (secrets are never returned)
      description: "Admins may pass `all=1` to list every account's credentials. Not callable with an API key."
      parameters:
        - { name: all, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: Credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DevCredential" } }
                  scopes: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [developer]
      summary: Create an API key (`yk_…`) or a Subsonic app password; the secret is returned once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind: { type: string, enum: [api_key, app_password] }
                name: { type: string, maxLength: 64 }
                scopes: { type: array, items: { type: string, enum: [read, playback, library-write, admin] }, description: "`read` is always added; `admin` only for admin accounts. App passwords default to read+playback+library-write." }
                allow_plain: { type: boolean, default: false, description: "app_password only: accept plaintext `p=` (legacy clients)" }
                expires_in_days: { type: integer, minimum: 0, maximum: 3650, description: "0 = never" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential: { $ref: "#/components/schemas/DevCredential" }
                  secret: { type: string, description: "Shown only once" }
                  note: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/developer/credentials/{id}:
    delete:
      tags: [developer]
      summary: Revoke a credential (owner, or any as admin); takes effect immediately
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }


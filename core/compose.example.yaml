# Copy to compose.yaml (git-ignored) and adjust paths / ids.
#
# User / permissions (PUID / PGID)
#   The image runs as uid:gid 1000:1000 by default (no root). It cannot chown
#   at runtime (distroless, no shell), so set `user:` to the NAS account that
#   owns the data dir and can read the music share:
#     - Synology DSM: SSH in and run `id <your-user>`; typically uid 1026+, gid 100 (users).
#     - fnOS (飞牛):   `id <your-user>` in the terminal; first user is usually 1000, gid 1001.
#     - Plain Linux:  `id -u` / `id -g`.
#   Then put them in a .env next to this file:  PUID=1026  PGID=100
#   and create the data dir owned by that user:  mkdir -p data && chown 1026:100 data
#
# Host paths
#   Synology:  /volume1/music      /volume1/docker/yimeng
#   fnOS:      /vol1/1000/Music    /vol1/1000/docker/yimeng
services:
  core:
    image: yimeng-core:latest
    build: .
    container_name: yimeng-core
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8741:8741"          # LAN only; do not expose to the internet
    environment:
      YIMENG_LIBRARY_ROOTS: /music      # comma-separated for several mounts, e.g. /music,/music2
      # YIMENG_SCAN_ON_START: "true"
      # YIMENG_WATCH: "auto"            # auto | fsnotify | poll | off
      # YIMENG_RESCAN_INTERVAL: "1h"    # periodic rescan when watching is unavailable
      TZ: Asia/Shanghai
    volumes:
      - /volume1/music:/music:ro
      # - /volume2/hires:/music2:ro
      - ./data:/var/yimeng                # library.db, cache/, vault/ (must be writable by PUID)
